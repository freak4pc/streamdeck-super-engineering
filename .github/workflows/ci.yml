name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm run pack
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: stream-deck-plugin
          path: dist/*.streamDeckPlugin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stream-deck-plugin
          path: release
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.streamDeckPlugin --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.streamDeckPlugin \
              --verify-tag \
              --generate-notes \
              --title "super.engineering $GITHUB_REF_NAME"
          fi
